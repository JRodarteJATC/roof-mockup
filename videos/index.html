<style>
:root{--bg:#f4f6f7;--card:#fff;--ink:#1b2a33;--muted:#5b6b74;--brand:#0e4c5a;--accent:#d9822b;--line:#dde3e6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:22px 20px 16px}
header h1{margin:0 0 4px;font-size:1.6rem}
header p{margin:0;opacity:.85;font-size:.95rem}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 220px;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:.9rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{padding:10px 20px 60px;max-width:1300px;margin:0 auto}
h2.group{margin:28px 0 4px;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
section h3{margin:18px 0 10px;font-size:1.25rem;color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;border:0;padding:0;width:100%;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.thumb .play{position:absolute;inset:0;margin:auto;width:64px;height:44px;border-radius:12px;background:rgba(217,130,43,.95)}
.thumb .play:after{content:"";position:absolute;left:26px;top:13px;border-left:16px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.card iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.meta{padding:10px 12px 12px}
.meta b{display:block;font-size:.95rem;line-height:1.3}
.meta span{display:block;color:var(--muted);font-size:.82rem;margin-top:4px}
.chan{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.chan .thumb{background:linear-gradient(135deg,#0e4c5a,#1d6f7f)}
.chan .label{position:absolute;left:12px;right:12px;top:12px;color:#fff;font-weight:700;font-size:1.05rem;text-align:left}
.chan .sub{position:absolute;left:12px;bottom:10px;color:#fff;opacity:.85;font-size:.8rem}
.hidden{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{width:min(1000px,100%)}
#modal iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:10px}
#modal .top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:10px;gap:12px}
#modal button{font-size:1rem;padding:10px 16px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;flex:none}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:20px}
</style>

const NC='https://www.youtube-nocookie.com/embed/';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const frame=(src,title)=>`<iframe src="${src}" title="${esc(title)}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
const main=document.getElementById('main');
let html='',lastGroup='';
const groups=[];
for(const s of DATA.sections){
  if(s.group!==lastGroup){html+=`<h2 class="group" data-g="${esc(s.group)}">${esc(s.group)}</h2>`;lastGroup=s.group}
  groups.push([s.key,s.title]);
  html+=`<section data-k="${s.key}" data-g="${esc(s.group)}"><h3>${esc(s.title)}</h3><div class="grid">`;
  for(const v of s.vids){
    html+=`<div class="card" data-s="${esc((v.t+' '+v.a+' '+v.n+' '+s.title).toLowerCase())}"><button class="thumb" type="button" data-id="${v.id}" data-t="${esc(v.t)}" aria-label="Play ${esc(v.t)}"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"><span class="play"></span></button><div class="meta"><b>${esc(v.t)}</b><span>${esc(v.a)}</span>${v.n?`<span>${esc(v.n)}</span>`:''}</div></div>`;
  }
  html+='</div></section>';
}
html+='<h2 class="group" data-g="Channels">Manufacturer &amp; Safety Channels</h2>';
for(const g of DATA.channels){
  const k='ch'+groups.length;groups.push([k,g.group]);
  html+=`<section data-k="${k}" data-g="Channels"><h3>${esc(g.group)}</h3><div class="grid">`;
  for(const c of g.items){
    html+=`<div class="chan card" data-s="${esc((c.n+' '+g.group).toLowerCase())}"><button class="thumb" type="button" data-list="${c.list}" data-t="${esc(c.n)}" aria-label="Play ${esc(c.n)} channel"><span class="label">${esc(c.n)}</span><span class="play"></span><span class="sub">All videos from this channel</span></button></div>`;
  }
  html+='</div></section>';
}
main.innerHTML=html;
const chips=document.getElementById('chips');
chips.innerHTML='<button class="chip on" data-k="all" type="button">All</button>'+groups.map(([k,t])=>`<button class="chip" data-k="${k}" type="button">${esc(t)}</button>`).join('');
let cur='all';
function filter(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('section').forEach(sec=>{
    let any=false;
    sec.querySelectorAll('.card').forEach(c=>{const ok=!q||c.dataset.s.includes(q);c.classList.toggle('hidden',!ok);any=any||ok});
    sec.classList.toggle('hidden',!(any&&(cur==='all'||sec.dataset.k===cur)));
  });
  document.querySelectorAll('h2.group').forEach(h=>{h.classList.toggle('hidden',![...document.querySelectorAll(`section[data-g="${h.dataset.g}"]`)].some(s=>!s.classList.contains('hidden')))});
}
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=b.dataset.k;chips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));filter()});
document.getElementById('q').addEventListener('input',filter);
main.addEventListener('click',e=>{
  const b=e.target.closest('.thumb');if(!b)return;
  const src=b.dataset.list?`${NC}videoseries?list=${b.dataset.list}&rel=0&autoplay=1`:`${NC}${b.dataset.id}?rel=0&autoplay=1`;
  b.outerHTML=frame(src,b.dataset.t);
});
const modal=document.getElementById('modal');
function openModal(id,title){document.getElementById('mt').textContent=title||'';document.getElementById('mp').innerHTML=frame(`${NC}${id}?rel=0`,title||'Video');modal.classList.remove('hidden')}
document.getElementById('mc').onclick=()=>{modal.classList.add('hidden');document.getElementById('mp').innerHTML='';history.replaceState(null,'',location.pathname)};
const v=new URLSearchParams(location.search).get('v');
if(v&&/^[\w-]{11}$/.test(v)){const b=document.querySelector(`.thumb[data-id="${v}"]`);openModal(v,b?b.dataset.t:'')}
</script>
